name: EC2 Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Code
        run: |
          echo "Deploying application to EC2..."
          sudo cp -r * /var/www/html/
          sudo chmod -R 755 /var/www/html/

          